# Publish the Python package to PyPI using trusted publishing (OIDC).
#
# No API token is stored anywhere: PyPI mintes a short-lived credential from the
# GitHub Actions OIDC identity of this repository. That is why nothing needs to
# be pasted into chat or written to a secret.
#
# Setup (one time, in the PyPI web UI — no token to copy):
#   1. pypi.org -> Manage -> Publishing -> Add a new pending publisher
#   2. Project: freeaipi
#      Workflow name: publish-pypi.yml
#      Repository: Virus-101/V-lib-freeapi
#      Environment: (optional but recommended) "pypi"
#   3. Then create a release tag `v0.1.0` and this runs.
#
# Nothing publishes until that tag exists.

name: publish-pypi

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OIDC token PyPI trusts.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the artifacts are well-formed
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Restrict which workflows can publish: only this repo, this branch.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Trusted publishing: no PYPI_TOKEN secret, no token in the repo.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
