[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeaipi"
version = "0.2.0"
description = "One Python interface for every free LLM API — native free tiers, local models, and OpenRouter free models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Virus-101" }]
keywords = ["llm", "free", "openai-compatible", "openrouter", "pollinations", "ollama", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "respx>=0.21.0"]

[project.urls]
Homepage = "https://github.com/Virus-101/V-lib-freeapi"

[project.scripts]
freeaipi = "freeaipi.cli:main"
fllm = "freeaipi.cli:main"

[tool.setuptools.packages.find]
include = ["freeaipi*", "fllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real network endpoints; run with LIVE=1",
]
